<div class="card" data-card-id="card-01">
  <style>
    .card[data-card-id="card-01"] .root {
      position: absolute;
      left: 40px;
      top: 1232px;
      width: 1000px;
      height: 560px;
      box-sizing: border-box;
      padding: 60px 60px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 26px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(22px) saturate(135%);
      backdrop-filter: blur(22px) saturate(135%);
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6);
      color: var(--text);
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
    }
    .card[data-card-id="card-01"] .kicker {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-1);
      opacity: 0;
    }
    .card[data-card-id="card-01"] .title {
      margin: 0;
      font-size: 96px;
      line-height: 1.04;
      font-weight: 800;
      letter-spacing: -0.02em;
      opacity: 0;
    }
    .card[data-card-id="card-01"] .title .hi {
      color: var(--accent-0);
      font-style: italic;
    }
    .card[data-card-id="card-01"] .rule {
      width: 0;
      height: 10px;
      border-radius: 6px;
      background: var(--accent-0);
    }
  </style>

  <div class="root">
    <div
      class="kicker"
      id="card-01-kicker"
      data-anim="fade-in"
      data-anim-at="0.2"
      data-anim-duration="0.45"
    >
      Gujarati Homes · A Universal Truth
    </div>
    <h1
      class="title"
      id="card-01-title"
      data-anim="slide-in"
      data-anim-at="0.5"
      data-anim-duration="0.55"
    >
      Guests have a <span class="hi">style</span> of just showing up.
    </h1>
    <div
      class="rule"
      id="card-01-rule"
      data-anim="grow-x"
      data-anim-at="0.95"
      data-anim-duration="0.5"
      data-anim-target-w="220"
    ></div>
  </div>
</div>
